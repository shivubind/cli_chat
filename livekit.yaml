# LiveKit Server Configuration
# Start with: livekit-server --config livekit.yaml --dev

# Bind to all interfaces (required for remote clients)
bind_addresses:
  - "0.0.0.0"

# Server port
port: 7880

# WebRTC configuration
rtc:
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  tcp_port: 7881

# API keys (client must use matching key/secret)
keys:
  devkey: secret

# Logging
logging:
  level: info

# Room settings
room:
  auto_create: true
  empty_timeout: 300
