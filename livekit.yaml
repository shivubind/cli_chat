# LiveKit Server Configuration
# Start with: livekit-server --config livekit.yaml --dev

# Bind to all interfaces (required for remote clients)
bind_addresses:
  - "0.0.0.0"

# Server port
port: 7880

# WebRTC configuration
rtc:
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  tcp_port: 7881
  # Use STUN for NAT traversal (without stun: prefix in host)
  stun_servers:
    - "stun.l.google.com:19302"
    - "stun1.l.google.com:19302"

# API keys (client must use matching key/secret)
keys:
  devkey: secret

# Logging
logging:
  level: info

# Room settings
room:
  auto_create: true
  empty_timeout: 300


# sudo ufw allow 7880/tcp
# sudo ufw allow 7881/tcp
# sudo ufw allow 50000:60000/udp
# # Stop existing LiveKit
# pkill livekit-server

# # Start with new config
# livekit-server --config livekit.yaml --dev --bind 0.0.0.0
